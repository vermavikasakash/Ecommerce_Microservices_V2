spring.application.name=order
server.port=8083

spring.data.mongodb.uri=${MONGODB_URI}

services.cart.url=${CART_SERVICE_URL}
services.product.url=${PRODUCT_SERVICE_URL}
services.payment.url=${PAYMENT_SERVICE_URL}

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

app.rabbitmq.exchange=ecommerce.events

logging.level.org.springframework.amqp=DEBUG
logging.level.org.springframework.rabbit=DEBUG
logging.level.org.springframework.amqp.rabbit.connection=DEBUG